---
# Örnek envanter: gerçek ana bilgisayar adlarını ve kimlik bilgilerini güncelleyin.
# WinRM: ansible_connection: winrm
# SSH (Windows OpenSSH): ansible_connection: ssh
#
# Kimlik doğrulama (WinRM + NTLM):
# - Etki alanı kullanıcısı: tırnak içinde ters eğik çizgi kullanın, düz çizgi DEĞİL.
#   Örnek: ansible_user: "HOMELAB\\ansible.user"
#   Alternatif UPN: ansible_user: "ansible.user@homelab.lan"
# - Yerel kullanıcı: ansible_user: ".\ansible.user" veya sadece kullanıcı adı
# "ntlm: the specified credentials were rejected" genelde yanlış biçim, yanlış şifre,
# hesabın WinRM ile oturum açmaya yetkisi olmaması veya hedefin etki alanı güven ayarlarıdır.
# Bazı etki alanı ortamlarında ansible_winrm_transport: credssp gerekir (sunucuda CredSSP açık olmalı).

all:
  children:
    windows_servers:
      hosts:
        win-server-01:
          ansible_host: 192.0.2.10
        # win-server-02:
        #   ansible_host: 192.0.2.11
  vars:
    ansible_user: Administrator
    # Şifre için tercihen Vault kullanın; aşağıdaki satırı kaldırıp group_vars veya --ask-vault-pass ile yükleyin.
    # ansible_password: "{{ vault_ansible_password }}"

    # WinRM (varsayılan örnek — ortamınıza göre düzenleyin)
    ansible_connection: winrm
    ansible_port: 5986
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore

    # SSH kullanmak için yukarıdaki winrm satırlarını yorumlayıp bunları açın:
    # ansible_connection: ssh
    # ansible_shell_type: powershell
    # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
