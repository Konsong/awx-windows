---
# Tasks to patch a Windows Server

- name: Windows update playbook
  hosts: windows
  gather_facts: false

  vars:
    reject_list:
      - KB5034439
      - KB1111111
      - KB5012170

  tasks:

    - name: Proof the logging path does exist
      ansible.windows.win_file:
        path: C:\Automation\logs\update
        state: directory

    - name: Revoke 30d update block
      ansible.windows.win_shell: |
        $pause = (Get-Date).AddDays(0)
        $pause = $pause.ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        Set-ItemProperty `
          -Path 'HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings' `
          -Name 'PauseUpdatesExpiryTime' `
          -Value $pause

    - name: Reset Windows Update components
      ansible.windows.win_shell: |
        Stop-Service -Name BITS,WaaSMedicSvc,wuauserv,CryptSvc -Force

        if (Test-Path 'C:\Windows\System32\catroot2') {
            Remove-Item -Path 'C:\Windows\System32\catroot2' -Recurse -Force
        }

        if (Test-Path 'C:\Windows\SoftwareDistribution') {
            Remove-Item -Path 'C:\Windows\SoftwareDistribution' -Recurse -Force
        }

        Start-Service -Name BITS,WaaSMedicSvc,wuauserv,CryptSvc

        UsoClient RefreshSettings
        UsoClient StartScan
      become: true
      become_method: runas
      become_user: SYSTEM

    - name: Get current date and time
      ansible.builtin.shell:
        cmd: date '+%Y%m%d'
        executable: /bin/bash
      register: current_time
      delegate_to: localhost
      changed_when: false
      become: false

    - name: Set log-file name
      ansible.builtin.set_fact:
        log_file_name: "win-updates-log-{{ current_time.stdout | trim }}.txt"

    - name: Check for available updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - DefinitionUpdates
        reject_list: "{{ reject_list }}"
        state: searched
        server_selection: windows_update
        log_path: "C:\\Automation\\logs\\update\\{{ log_file_name }}"
      register: update_result
      become: true
      become_method: runas
      become_user: SYSTEM

    - name: Update check results
      debug:
        var: update_result

    - name: Apply pending updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - DefinitionUpdates
        reject_list: "{{ reject_list }}"
        state: installed
        server_selection: windows_update
        reboot: true
        reboot_timeout: 1800
        log_path: "C:\\Automation\\logs\\update\\{{ log_file_name }}"
      register: apply_result
      retries: 2
      delay: 60
      until: apply_result is succeeded
      ignore_errors: true
      become: true
      become_method: runas
      become_user: SYSTEM

    - name: Output update application results
      debug:
        var: apply_result

    - name: Set update block to 30d
      ansible.windows.win_shell: |
        $pause = (Get-Date).AddDays(30)
        $pause = $pause.ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

        Set-ItemProperty `
          -Path 'HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings' `
          -Name 'PauseUpdatesExpiryTime' `
          -Value $pause
